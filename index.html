<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydroponic Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}
h1{
    text-align:center;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin:15px 0;
}
.value{
    font-size:30px;
    color:#00ff99;
}
</style>

</head>

<body>

<h1>🌱 Hydroponic Dashboard</h1>
    <div class="card">
<h2>Select Crop</h2>

<select id="crop">
<option>Tomato</option>
<option>Chilli</option>
<option>Lettuce</option>
</select>

<br><br>

<select id="stage">
<option>Vegetative</option>
<option>Flowering</option>
<option>Fruiting</option>
<option>Growth</option>
</select>

    </div>

<div class="card">
<h2>pH</h2>
<div class="value" id="ph">Loading...</div>
</div>

<div class="card">
<h2>EC</h2>
<div class="value" id="ec">Loading...</div>
</div>

<div class="card">
<h2>PPM</h2>
<div class="value" id="ppm">Loading...</div>
</div>

<div class="card">
<h2>Water Temperature</h2>
<div class="value" id="temp">Loading...</div>
</div>

<div class="card">
<h2>Water Level</h2>
<div class="value" id="level">Loading...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>


</body>
</html>
