<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydroponic Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}
h1{
    text-align:center;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin:15px 0;
}
.value{
    font-size:30px;
    color:#00ff99;
}
</style>

</head>

<body>

<h1>🌱 Hydroponic Dashboard</h1>

<div class="card">
<h2>pH</h2>
<div class="value">6.20</div>
</div>

<div class="card">
<h2>EC</h2>
<div class="value">1.85 mS/cm</div>
</div>

<div class="card">
<h2>PPM</h2>
<div class="value">925</div>
</div>

<div class="card">
<h2>Water Temperature</h2>
<div class="value">24°C</div>
</div>

<div class="card">
<h2>Water Level</h2>
<div class="value">18 L</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>

</body>
</html>
